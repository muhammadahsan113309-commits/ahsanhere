<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/shield-halved.svg">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { --bg: #0b0f19; --card: #151c2c; --accent: #6366f1; --danger: #ef4444; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #fff; margin: 0; padding: 24px; min-height: 100vh; }
    
    /* Login Modal */
    #loginModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .login-box { background: var(--card); padding: 35px; border-radius: 16px; width: 340px; text-align: center; border: 1px solid var(--border); }
    
    .input-field { width: 100%; padding: 11px 14px; margin: 8px 0; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; }
    .input-field:focus { border-color: var(--accent); }
    
    .btn { padding: 10px 16px; background: var(--accent); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #334155; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
    
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .stat-card h4 { margin: 0; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
    .stat-card p { margin: 6px 0 0 0; font-size: 24px; font-weight: 700; color: #fff; }

    .section-title { font-size: 16px; font-weight: 700; margin: 24px 0 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .editor-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .card { background: var(--card); border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--border); }
    .card-img-wrapper { position: relative; height: 180px; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.2s ease; }
    .card img:hover { transform: scale(1.04); }
    
    .card-body { padding: 14px; }
    .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 2; }
    .card-download-btn { position: absolute; top: 8px; left: 8px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .card-download-btn:hover { background: var(--accent); }

    /* Lightbox Modal */
    #imageModal { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; flex-direction: column; padding: 20px;
    }
    .lightbox-content { position: relative; max-width: 90%; max-height: 80%; display: flex; flex-direction: column; align-items: center; }
    .lightbox-content img { max-width: 100%; max-height: 75vh; border-radius: 12px; border: 2px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .lightbox-tools { margin-top: 15px; display: flex; gap: 12px; align-items: center; }
    .close-lightbox { position: absolute; top: -40px; right: 0; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; }
  </style>
</head>
<body>

<!-- LOGIN MODAL -->
<div id="loginModal">
  <div class="login-box">
    <i class="fa-solid fa-shield-halved" style="font-size:32px; color:var(--accent); margin-bottom:12px;"></i>
    <h3 style="margin:0 0 15px 0;">Admin Authorization</h3>
    <input type="password" id="adminPassword" class="input-field" placeholder="Enter Admin Password">
    <button class="btn" style="width:100%; margin-top:10px;" onclick="checkAuth()">Login</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="adminContent" style="display:none;">
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <i class="fa-solid fa-clipboard-user" style="font-size:24px; color:var(--accent);"></i>
      <h2 style="margin:0;">Attendance Admin Portal</h2>
    </div>
    <button class="btn btn-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </header>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card"><h4>Total Logs</h4><p id="statTotal">0</p></div>
    <div class="stat-card"><h4>Male Attendances</h4><p id="statMale">0</p></div>
    <div class="stat-card"><h4>Female Attendances</h4><p id="statFemale">0</p></div>
  </div>

  <!-- REDIRECT URL CONFIGURATION -->
  <div class="section-title">
    <span><i class="fa-solid fa-link"></i> Redirect URL Configuration</span>
  </div>
  <div class="editor-box">
    <label style="font-size:12px; color:#94a3b8;">User Destination URL (e.g. youtube.com, google.com, https://mywebsite.com)</label>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <input type="text" id="edit_redirectUrl" class="input-field" placeholder="https://youtube.com" style="margin:0;">
      <button class="btn" onclick="saveRedirectUrl()"><i class="fa-solid fa-floppy-disk"></i> Update Link</button>
    </div>
  </div>

  <!-- EDIT TEXT SECTION -->
  <div class="section-title">
    <span><i class="fa-solid fa-pen-to-square"></i> Customize Kiosk Interface Text</span>
  </div>
  <div class="editor-box">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;">
      <div>
        <label style="font-size:12px; color:#94a3b8;">Step 1 Title</label>
        <input type="text" id="edit_step1Title" class="input-field" value="Welcome">
        <label style="font-size:12px; color:#94a3b8;">Step 1 Subtitle</label>
        <input type="text" id="edit_step1Sub" class="input-field" value="Enter name">
        <label style="font-size:12px; color:#94a3b8;">Step 1 Button</label>
        <input type="text" id="edit_step1Btn" class="input-field" value="Verify You Are Human">
      </div>
      <div>
        <label style="font-size:12px; color:#94a3b8;">Step 2 Title</label>
        <input type="text" id="edit_step2Title" class="input-field" value="Facial Verification">
        <label style="font-size:12px; color:#94a3b8;">Step 2 Subtitle</label>
        <input type="text" id="edit_step2Sub" class="input-field" value="Ensure your face is clearly visible">
        <label style="font-size:12px; color:#94a3b8;">Step 2 Button</label>
        <input type="text" id="edit_step2Btn" class="input-field" value="Proceed!">
      </div>
    </div>
    <button class="btn" onclick="saveUIText()" style="margin-top:12px;"><i class="fa-solid fa-floppy-disk"></i> Save Text Settings</button>
  </div>

  <!-- ATTENDANCE RECORDS SECTION -->
  <div class="section-title">
    <span><i class="fa-solid fa-list-check"></i> Live Logs</span>
    <div style="display:flex; gap:10px;">
      <input type="text" id="searchBox" class="input-field" placeholder="Search name..." onkeyup="filterRecords()" style="margin:0; width:180px; padding:6px 10px;">
      <button class="btn btn-secondary" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
      <button class="btn btn-danger" onclick="clearAllData()"><i class="fa-solid fa-trash-can"></i> Clear All</button>
    </div>
  </div>
  
  <div class="grid" id="recordsGrid"></div>
</div>

<!-- IMAGE LIGHTBOX MODAL -->
<div id="imageModal" onclick="closeModalOnBg(event)">
  <div class="lightbox-content">
    <button class="close-lightbox" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    <img id="modalImg" src="" alt="Enlarged View">
    <div class="lightbox-tools">
      <button class="btn btn-secondary btn-sm" id="lightboxDownloadBtn" onclick="downloadImageFromLightbox()"><i class="fa-solid fa-download"></i> Download Image</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
    authDomain: "reakweb.firebaseapp.com",
    databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
    projectId: "reakweb",
    storageBucket: "reakweb.firebasestorage.app",
    messagingSenderId: "228639861953",
    appId: "1:228639861953:web:2941663bb550703b61b840"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let rawAttendanceData = [];
  let currentActivePhoto = '';
  let currentActiveName = '';

  window.checkAuth = () => {
    if (document.getElementById('adminPassword').value === "ahsan0315") {
      sessionStorage.setItem("adminAuth", "true");
      showDashboard();
    } else {
      alert("Invalid Password");
    }
  };

  window.logout = () => {
    sessionStorage.removeItem("adminAuth");
    location.reload();
  };

  function showDashboard() {
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    loadData();
    loadSettings();
  }

  if (sessionStorage.getItem("adminAuth") === "true") showDashboard();

  window.deleteRecord = async (key) => {
    if (confirm("Delete this entry?")) {
      await remove(ref(db, `attendance/${key}`));
    }
  };

  window.clearAllData = async () => {
    if (confirm("Warning: Are you sure you want to delete ALL attendance records?")) {
      await remove(ref(db, 'attendance'));
    }
  };

  // Save Link Setting
  window.saveRedirectUrl = async () => {
    const url = document.getElementById('edit_redirectUrl').value.trim();
    if (!url) return alert("Please enter a valid URL.");
    await update(ref(db, 'settings'), { redirectUrl: url });
    alert("Redirect URL Updated!");
  };

  // Save Custom UI Text
  window.saveUIText = async () => {
    await update(ref(db, 'settings/uiText'), {
      step1Title: document.getElementById('edit_step1Title').value,
      step1Sub: document.getElementById('edit_step1Sub').value,
      step1Btn: document.getElementById('edit_step1Btn').value,
      step2Title: document.getElementById('edit_step2Title').value,
      step2Sub: document.getElementById('edit_step2Sub').value,
      step2Btn: document.getElementById('edit_step2Btn').value
    });
    alert("UI Text Updated!");
  };

  function loadSettings() {
    onValue(ref(db, 'settings'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.redirectUrl) document.getElementById('edit_redirectUrl').value = data.redirectUrl;
        
        if (data.uiText) {
          const text = data.uiText;
          if (text.step1Title) document.getElementById('edit_step1Title').value = text.step1Title;
          if (text.step1Sub) document.getElementById('edit_step1Sub').value = text.step1Sub;
          if (text.step1Btn) document.getElementById('edit_step1Btn').value = text.step1Btn;
          if (text.step2Title) document.getElementById('edit_step2Title').value = text.step2Title;
          if (text.step2Sub) document.getElementById('edit_step2Sub').value = text.step2Sub;
          if (text.step2Btn) document.getElementById('edit_step2Btn').value = text.step2Btn;
        }
      }
    });
  }

  function loadData() {
    onValue(ref(db, 'attendance'), (snapshot) => {
      const grid = document.getElementById('recordsGrid');
      grid.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        grid.innerHTML = '<p style="color:#94a3b8;">No attendance records available.</p>';
        updateStats(0, 0, 0);
        return;
      }

      rawAttendanceData = Object.entries(data).reverse();
      renderGrid(rawAttendanceData);
    });
  }

  function renderGrid(records) {
    const grid = document.getElementById('recordsGrid');
    grid.innerHTML = '';
    let male = 0, female = 0;

    records.forEach(([key, record]) => {
      if (record.gender === 'Male') male++;
      if (record.gender === 'Female') female++;

      const safeName = record.name ? record.name.replace(/'/g, "\\'") : 'User';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <button class="delete-btn" onclick="deleteRecord('${key}')" title="Delete record"><i class="fa-solid fa-trash"></i></button>
        <button class="card-download-btn" onclick="downloadImage('${record.photo}', '${safeName}')" title="Download Image"><i class="fa-solid fa-download"></i></button>
        
        <div class="card-img-wrapper">
          <img src="${record.photo}" onclick="openModal('${record.photo}', '${safeName}')" title="Click to enlarge">
        </div>

        <div class="card-body">
          <strong style="font-size:15px;">${record.name}</strong> 
          <span style="font-size:11px; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.1); margin-left:4px;">${record.gender}</span>
          
          <div style="font-size:11px; color:#a5b4fc; margin-top:8px;">
            <i class="fa-solid fa-network-wired"></i> ${record.ip || 'Unknown IP'}
          </div>
          <div style="font-size:11px; color:#94a3b8; margin-top:3px;">
            <i class="fa-solid fa-location-dot"></i> ${record.location || 'Unknown Loc'}
          </div>
          <div style="font-size:11px; color:#94a3b8; margin-top:3px;">
            <i class="fa-solid fa-mobile-screen-button"></i> ${record.device || 'Unknown Device'}
          </div>

          <div style="font-size:11px; color:#64748b; margin-top:8px;">
            <i class="fa-regular fa-clock"></i> ${new Date(record.timestamp).toLocaleString()}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    updateStats(records.length, male, female);
  }

  function updateStats(total, male, female) {
    document.getElementById('statTotal').innerText = total;
    document.getElementById('statMale').innerText = male;
    document.getElementById('statFemale').innerText = female;
  }

  window.filterRecords = () => {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const filtered = rawAttendanceData.filter(([k, r]) => r.name.toLowerCase().includes(q));
    renderGrid(filtered);
  };

  /* Lightbox Functions */
  window.openModal = (src, name) => {
    currentActivePhoto = src;
    currentActiveName = name;
    document.getElementById('modalImg').src = src;
    document.getElementById('imageModal').style.display = 'flex';
  };

  window.closeModal = () => {
    document.getElementById('imageModal').style.display = 'none';
  };

  window.closeModalOnBg = (e) => {
    if (e.target.id === 'imageModal') {
      window.closeModal();
    }
  };

  window.downloadImageFromLightbox = () => {
    window.downloadImage(currentActivePhoto, currentActiveName);
  };

  /* Direct Download Helper */
  window.downloadImage = (dataUrl, userName) => {
    const a = document.createElement('a');
    a.href = dataUrl;
    const dateStr = new Date().toISOString().slice(0, 10);
    const cleanName = (userName || 'user').replace(/\s+/g, '_').toLowerCase();
    a.download = `${cleanName}_photo_${dateStr}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  window.exportCSV = () => {
    if (!rawAttendanceData.length) return alert("No data to export.");
    let csv = "Name,Gender,IP,Location,Device,Timestamp\n";
    rawAttendanceData.forEach(([k, r]) => {
      csv += `"${r.name || ''}","${r.gender || ''}","${r.ip || ''}","${r.location || ''}","${r.device || ''}","${r.timestamp || ''}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `attendance_log_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };
</script>
</body>
</html>
